<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1200 620" role="img" aria-label="Three houses with retro PCs, each plugged into a NetKey box. The boxes link through a relay, or directly, and join every house into one LAN stretched across VPN, real Layer 2."><title>How NetKey connects</title><style>svg{--bg:#f5f6f8;--surface:#ffffff;--border:#d2d7de;--text:#0e141b;--accent:#16a34a;--cable:#6b7683;--beige:#e8e1cd;--edge:#a39a85;--soft:#eef0f3;--lan:#e4f4e9;--lanedge:#93d1a6}@media (prefers-color-scheme: dark){svg{--bg:#0a0c0f;--surface:#12161b;--border:#2d3640;--text:#e7edf3;--accent:#3ddc84;--cable:#8794a1;--beige:#d3cab2;--edge:#8a826e;--soft:#171c22;--lan:#0f2318;--lanedge:#2b6b47}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--text);font-size:20px;font-weight:650}.house{fill:var(--surface);stroke:var(--border);stroke-width:2;stroke-linejoin:round}.cable{fill:none;stroke:var(--cable);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.link{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-dasharray:10 7;stroke-linecap:round;animation:f 1.2s linear infinite}.lanlbl{font-size:15px;font-weight:600;fill:var(--accent)}@keyframes f{to{stroke-dashoffset:-17}}@media (prefers-reduced-motion: reduce){.link{animation:none}}.beige{fill:var(--beige);stroke:var(--edge);stroke-width:1.4}</style><rect x="0" y="40" width="1200" height="620" fill="var(--bg)"/><path class="house" d="M30 575 V380 L200.0 290 L370 380 V575 Z"/><path class="house" d="M430 575 V380 L600.0 290 L770 380 V575 Z"/><path class="house" d="M830 575 V380 L1000.0 290 L1170 380 V575 Z"/><rect x="50" y="440" width="300" height="92" rx="16" fill="none" stroke="var(--lanedge)" stroke-width="3"/><rect x="450" y="440" width="300" height="92" rx="16" fill="none" stroke="var(--lanedge)" stroke-width="3"/><rect x="842" y="428" width="316" height="134" rx="16" fill="none" stroke="var(--lanedge)" stroke-width="3"/><path d="M290 466 C 290 300, 400 176, 545 17