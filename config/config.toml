# netkey configuration. Installed to /etc/netkey/config.toml (kept on reinstall).
# Restart after editing:  sudo systemctl restart netkey.target
# Settings changed in the web GUI (mode, modem and physical-modem options, logging) are stored in
# /var/lib/netkey/netkey.db and override the values here; "reset to default" in the GUI returns to them.
# Changing [auth], [ppp] or [lines]: re-run install.sh so peers files and /etc/ppp/pap-secrets are regenerated.
# Plug-and-play: each USB serial adapter gets the next free line on first plug-in (kept in
# /var/lib/netkey/lines.json). Line N uses pppd peers netkeyN and client IP first_client_ip + N. Unplugged adapters
# keep their line; when all lines are taken, a new adapter gets the line of the one unplugged longest.

[box]
name = ""                  # name other boxes see in LAN parties ("" = the hostname); also settable in the GUI

[serial]
device = "/dev/netkey{line}"   # only for manual "modem.py --line N"; the manager passes each adapter's stable path
baud = 115200              # starting speed; autobaud follows the PC in command mode
autobaud = true
rtscts = false             # true only with a cable that crosses RTS/CTS (also set crtscts in the peers file)
control_lines = "auto"     # auto | off
pc_dtr_input = "dsr"       # dsr | dcd | none : Pi input wired to the PC's DTR (ignored until seen high)
dcd_mode = "always_on"     # always_on | follow : Pi DTR -> PC DSR+DCD. XP won't dial without DSR, so keep always_on

[modem]
connect_string = "CONNECT 56000"
dial_delay_s = 1.0
model = "USRobotics 56K FAX EXT"   # changing this changes Windows' detection ID

[ppp]
command = ["/usr/sbin/pppd", "call", "netkey{line}"]
stop_timeout_s = 5.0
server_name = "netkey"   # must match "name" in the peers files (rendered from ppp/netkey.peer.in)
server_ip = "10.66.0.1"
first_client_ip = "10.66.0.2"   # line 0 -> .2, line 1 -> .3, ...

[auth]
# Imported once into the dial-in user DB on first install; afterwards manage users in the web GUI.
users = [{ name = "test", password = "test" }]

[lines]
max = 8                    # USB serial adapters are assigned lines 0..max-1 on first plug-in (re-run install.sh after changing)
default_mode = "virtual"   # virtual: the Pi is the modem (PC on a null-modem cable) | physical: a real modem is on the port
modes = {}                 # per-line override, e.g. { "1" = "physical" }

[physical]                 # physical modem mode: Pi --straight RS-232 cable--> external modem <-- phone line --> PC's modem
baud = 115200              # fixed speed between the Pi and the modem
rtscts = true              # hardware flow control with the modem
init_string = "AT&FE0V1Q0X4&C1&D2S0=0"   # keep E0 V1 &C1 (DCD = carrier) &D2 (DTR drop hangs up); S0=0: the Pi answers
answer_rings = 1           # ATA after this many RINGs
answer_timeout_s = 60.0
dcd_hangup = true          # end the call when the modem drops DCD
health_interval_s = 60.0   # idle AT probe; re-initialise the modem when it does not answer

[web]
bind = ""                  # all interfaces
port = 443                 # HTTPS with the self-signed certificate in /etc/netkey/tls (made by install.sh)
http_port = 80             # redirects to HTTPS; 0 = off
cert = "/etc/netkey/tls/cert.pem"
key = "/etc/netkey/tls/key.pem"
session_hours = 12
stats_days = 7             # dashboard history kept in the DB

[log]
level = "INFO"
raw_command_bytes = false  # true: hex dump of command-mode input (never data mode)
